n_samples: 200
languages: ["en", "de", "fr", "es", "it", "nl"]
surfaces: ["document", "code_editor", "server_inventory", "magazine_spread", "chat_ui", "form", "invoice"]
categories:
  - word_center
  - word_bbox
  - line_start
  - line_end
  - between_words
  - char_center
  - char_bbox
  - punctuation
  - blank_line
  - caret_before_word
  - caret_after_word
  - caret_between_chars
  - line_bbox
  - sentence_boundary
  - structural_text
  - paragraph_start
  - paragraph_end
  - paragraph_bbox
  - invoice_number
  - invoice_date
  - invoice_due_date
  - invoice_subtotal
  - invoice_tax
  - invoice_tax_id
  - invoice_total
  - invoice_totals
  - invoice_sender
  - invoice_sender_city
  - invoice_sender_zip
  - invoice_recipient
  - invoice_recipient_city
  - invoice_recipient_zip
  - invoice_bic
  - invoice_iban
  - invoice_bank_details
  - invoice_email
  - invoice_phone
  - invoice_line_item
  - invoice_line_items
themes: ["light", "dark", "sepia", "high_contrast"]
font_sizes: [13, 14, 16, 18, 20, 22]
enable_distractors: true
enable_occlusion: true
max_retries_per_row: 5
num_workers: null  # null = use all CPU cores (os.cpu_count()); lower this on memory-constrained machines
output_dir: "output/synthetic_v0"
seed: 42
push_to_hub: false
hub_repo_id: null
hub_token: null
