# Primary target from the project spec: single Colab T4 (16GB). QLoRA
# (4-bit base) + fp16 + gradient checkpointing + small per-device batch with
# grad accumulation to fit.
device: "cuda"
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
num_train_epochs: 3
max_steps: -1
fp16: true
gradient_checkpointing: true
quantization: "4bit"
dataloader_num_workers: 4
