# Secondary target: multi-GPU/multi-node, launched via
# `accelerate launch --config_file configs/accelerate/multi_gpu.yaml <script>`.
device: "cuda"
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
num_train_epochs: 3
max_steps: -1
fp16: true
gradient_checkpointing: true
quantization: "none"
dataloader_num_workers: 8
