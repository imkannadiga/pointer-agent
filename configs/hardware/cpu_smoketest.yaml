# Proves the training scripts are correct, not a real training run: a
# handful of steps on a tiny data subset, CPU only, no quantization
# (bitsandbytes doesn't run without CUDA).
device: "cpu"
per_device_train_batch_size: 2
gradient_accumulation_steps: 1
num_train_epochs: 1
max_steps: 3
fp16: false
gradient_checkpointing: false
quantization: "none"
dataloader_num_workers: 0
